name: Bug report
description: Something in QuotaPilot (macOS app, CLI or website) does not work as expected.
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Where did it happen?
      options:
        - macOS menu bar app
        - quotapilot CLI on macOS
        - quotapilot CLI on Linux
        - quotapilot CLI on Windows
        - AI Quota Watch website
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: QuotaPilot version (`quotapilot --version`), OS version, and Codex CLI / Claude Code versions if relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Do not upload auth files, account identifiers, usage histories, or conversation content. Redact screenshots.
