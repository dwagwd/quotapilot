name: CI
on:
  push:
    paths-ignore: ["site/**", ".github/workflows/community-data.yml", ".github/workflows/site-pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/community-data.yml", ".github/workflows/site-pages.yml"]
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Test and inspect source export
        run: ./scripts/check.sh
      - name: Build native app
        run: ./scripts/build.sh
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test core and CLI
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          swift test
          swift build -c release --product quotapilot
          .build/release/quotapilot version
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@581df1ffa3f3e786ddc73ff37364ee231f9644c5 # v0.3.0
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Build CLI
        run: |
          swift build -c release --product quotapilot
          .build\release\quotapilot.exe version
