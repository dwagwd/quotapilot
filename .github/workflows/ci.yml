name: CI
on:
  push:
    # Branches only: a version tag points at the release commit, whose formula is pinned by the next commit, so the
    # release hygiene check cannot pass there. release.yml checks the tag commit itself.
    branches: ["**"]
    paths-ignore: ["site/**", ".github/workflows/community-data.yml", ".github/workflows/site-pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/community-data.yml", ".github/workflows/site-pages.yml"]
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Test and inspect source export
        run: ./scripts/check.sh
      - name: Build native app
        run: ./scripts/build.sh
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container: swift:6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test core and CLI
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          swift test
          swift build -c release --product quotapilot
          .build/release/quotapilot version
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Test core
        run: swift test
      - name: Build CLI
        run: |
          swift build -c release --product quotapilot
          .build\release\quotapilot.exe version
