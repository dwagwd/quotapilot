# AI Quota Watch (site/): saves "data-report" issues and rebuilds the community stats.
# main is protected, so the data lives on the unprotected `community-data` branch
# (submissions/*.json + community.json); site-pages.yml copies it into the site when it deploys.
# Reports come from `quotapilot share`, the app's daily share, or the website form.
name: Community data

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: "17 */6 * * *"   # re-aggregate so the 7-day window keeps moving, and pick up missed issues
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: community-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Issues from the site form carry the label; issues filed by `quotapilot share --submit` or the app carry the marker.
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'data-report') || contains(github.event.issue.body, '<!-- quotapilot-share -->')
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Load stored data
        run: |
          git fetch --depth 1 origin community-data:community-data 2>/dev/null || true
          mkdir -p store
          if git rev-parse --verify -q community-data >/dev/null; then
            git --work-tree=store checkout community-data -- . && git reset -q
          fi
          mkdir -p store/submissions
          cp store/submissions/*.json site/data/submissions/ 2>/dev/null || true
      - name: Save reports from issues
        working-directory: site
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            node scripts/ingest-issue.mjs "$GITHUB_EVENT_PATH" && echo "${{ github.event.issue.number }}" >> "$RUNNER_TEMP/done"
          else
            # Scheduled or manual runs pick up open report issues that a failed run left behind.
            gh issue list --repo "$REPO" --state open --limit 50 --json number,body,author,createdAt,labels \
              --jq '.[] | select(((.body // "") | contains("<!-- quotapilot-share -->")) or (.labels | map(.name) | index("data-report")))' > "$RUNNER_TEMP/open.jsonl" || true
            while read -r line; do
              n=$(printf "%s\n" "$line" | jq -r .number)
              printf "%s\n" "$line" | jq '{issue: {number: .number, body: .body, created_at: .createdAt, user: {login: .author.login}}}' > "$RUNNER_TEMP/event.json"
              if node scripts/ingest-issue.mjs "$RUNNER_TEMP/event.json"; then echo "$n" >> "$RUNNER_TEMP/done"; fi
            done < "$RUNNER_TEMP/open.jsonl"
          fi
      - name: Aggregate
        working-directory: site
        run: |
          cp ../store/community.json data/community.json 2>/dev/null || true
          node scripts/aggregate.mjs
      - name: Store data on the community-data branch
        run: |
          cp site/data/submissions/*.json store/submissions/ 2>/dev/null || true
          cp site/data/community.json store/community.json
          cd store
          git init -q -b community-data
          git config user.name "community-bot"
          git config user.email "community-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin community-data && git reset -q --soft FETCH_HEAD || true
          git add -A
          git diff --cached --quiet || git commit -qm "Update community data"
          git push -q origin HEAD:community-data
      - name: Thank and close saved issues
        run: |
          [ -f "$RUNNER_TEMP/done" ] || exit 0
          sort -u "$RUNNER_TEMP/done" | while read -r n; do
            gh issue edit "$n" --repo "$REPO" --add-label data-report || true
            gh issue comment "$n" --repo "$REPO" --body "Thanks, your report is saved. It shows on AI Quota Watch once at least 3 reports exist for the same model or plan."
            gh issue close "$n" --repo "$REPO"
          done
