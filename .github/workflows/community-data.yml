# AI Quota Watch (site/): rebuilds the community stats from the anonymous collector.
# Sharing is anonymous only: reports come from `quotapilot share`, the app's daily share or the website form,
# all through the collector. Only the aggregate (community.json) is stored, on the unprotected
# `community-data` branch; site-pages.yml copies it into the site when it deploys. Raw reports never leave
# the collector, which deletes them after 31 days.
name: Community data

on:
  schedule:
    - cron: "17 */6 * * *"   # re-aggregate so the 7-day window keeps moving and deletions drop out
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-data
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COLLECTOR_URL: https://aiquotawatch.pages.dev/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Pull anonymous reports from the collector
        env:
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
        run: |
          [ -n "$COLLECTOR_TOKEN" ] || { echo "No collector token yet"; exit 0; }
          mkdir -p site/data/submissions
          curl -fsS --max-time 60 -H "Authorization: Bearer $COLLECTOR_TOKEN" "$COLLECTOR_URL/v1/export" -o "$RUNNER_TEMP/collector.json"
          jq -e 'type == "array"' "$RUNNER_TEMP/collector.json" >/dev/null
          cp "$RUNNER_TEMP/collector.json" site/data/submissions/collector.json
      - name: Aggregate
        working-directory: site
        run: node scripts/aggregate.mjs
      - name: Store the aggregate on the community-data branch
        run: |
          mkdir -p store && cp site/data/community.json store/community.json
          cd store
          git init -q -b community-data
          git config user.name "community-bot"
          git config user.email "community-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin community-data && git reset -q --soft FETCH_HEAD || true
          git add community.json
          git diff --cached --quiet || git commit -qm "Update community data"
          git push -q origin HEAD:community-data
