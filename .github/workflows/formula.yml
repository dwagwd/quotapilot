# Proves the supported install path works on a clean macOS runner: Homebrew builds QuotaPilot from source,
# the result is packed as a bottle (Homebrew's prebuilt package), and the bottle is installed again the way
# users get it. Runs for pull requests and on demand; a version tag builds and publishes its bottle in
# release.yml with the same script. Public repos run this for free.
name: Homebrew formula
on:
  pull_request:
    paths: ["Formula/**", "Sources/**", "Package.swift", "scripts/build.sh", "scripts/build-bottle.sh", ".github/workflows/formula.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brew:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build from source, bottle it and install the bottle
        run: ./scripts/build-bottle.sh "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$(cat VERSION)" "$RUNNER_TEMP/bottle"
      - name: Test the installed app and CLI
        run: |
          brew test dwagwd/quotapilot/quotapilot
          quotapilot --help | head -1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quotapilot-bottle
          path: ${{ runner.temp }}/bottle/*
          retention-days: 14
