name: Package artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    env:
      QUOTAPILOT_DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check.sh
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quotapilot
          path: dist/*.zip
          retention-days: 14
# This workflow creates downloadable CI artifacts; it does not publish a release.
