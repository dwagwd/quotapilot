# Publishes a source-only GitHub Release when a version tag is pushed: release notes from CHANGELOG.md,
# the source archive and its SHA-256, plus command-line binaries for Linux and Windows built on GitHub's own runners
# (no personal machine involved), and the Homebrew bottle for the macOS app, built and ad-hoc signed on the runner.
# After this workflow finishes, scripts/add-bottle.sh writes the bottle into the formula (docs/releasing.md); until that
# commit lands, and on Macs the bottle does not cover, Homebrew builds from source as before.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v0.6.5"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Check the release
        env:
          QUOTAPILOT_RELEASE_BUILD: "1"
        run: |
          VERSION="${TAG#v}"
          [ "$VERSION" = "$(cat VERSION)" ] || { echo "::error::tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
          ./scripts/check.sh
      - name: Source archive and notes
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          python3 scripts/source-archive.py "dist/QuotaPilot-$VERSION-source.zip"
          (cd dist && shasum -a 256 "QuotaPilot-$VERSION-source.zip" > SHA256SUMS.txt)
          # The CHANGELOG section for this version, up to the next "## " heading.
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > dist/notes.md
          printf '\n\nInstall or update:\n\n```sh\nbrew tap dwagwd/quotapilot https://github.com/dwagwd/quotapilot\nbrew install dwagwd/quotapilot/quotapilot   # or: brew upgrade quotapilot\n```\n\nBuilt from source on your Mac (about 2 minutes, needs the Xcode Command Line Tools).\n' >> dist/notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          # A retry by workflow_dispatch finds the release already there: keep it and only add the missing files.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/QuotaPilot-$VERSION-source.zip" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "QuotaPilot $VERSION" \
            --notes-file dist/notes.md --verify-tag "dist/QuotaPilot-$VERSION-source.zip" dist/SHA256SUMS.txt
  bottle:
    needs: release
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build the bottle and install it
        run: ./scripts/build-bottle.sh "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" "$RUNNER_TEMP/bottle"
      - name: Upload to the release
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/bottle/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Bottle uploaded. Next: scripts/add-bottle.sh $TAG, then commit the formula." >> "$GITHUB_STEP_SUMMARY"
  cli:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, container: "swift:6.2", ext: tar.gz }
          - { name: linux-arm64, os: ubuntu-24.04-arm, container: "swift:6.2", ext: tar.gz }
          - { name: windows-x64, os: windows-latest, ext: zip }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    continue-on-error: ${{ matrix.optional == true }}
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: quotapilot-${{ matrix.name }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install Swift (Windows)
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@581df1ffa3f3e786ddc73ff37364ee231f9644c5 # v0.3.0
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update -qq && apt-get install -y -qq gh >/dev/null
          swift build -c release --product quotapilot --static-swift-stdlib -Xswiftc -gnone -Xlinker -s
          cp .build/release/quotapilot quotapilot
          tar -czf "$ASSET" quotapilot LICENSE
          sha256sum "$ASSET" > "$ASSET.sha256"
          ./quotapilot version
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          swift build -c release --product quotapilot --static-swift-stdlib -Xswiftc -gnone
          Copy-Item .build\release\quotapilot.exe quotapilot.exe
          Compress-Archive -Path quotapilot.exe, LICENSE -DestinationPath $env:ASSET
          $h = (Get-FileHash $env:ASSET -Algorithm SHA256).Hash.ToLower()
          "$h  $env:ASSET" | Out-File -Encoding ascii "$env:ASSET.sha256"
          .\quotapilot.exe version
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber
