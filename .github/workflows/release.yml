# Publishes a source-only GitHub Release when a version tag is pushed: release notes from CHANGELOG.md,
# the source archive and its SHA-256, plus command-line binaries for Linux and Windows built on GitHub's own runners
# (no personal machine involved), and the Homebrew bottle for the macOS app, built and ad-hoc signed on the runner.
# After this workflow finishes, scripts/add-bottle.sh writes the bottle into the formula (docs/releasing.md); until that
# commit lands, and on Macs the bottle does not cover, Homebrew builds from source as before.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v0.6.5"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Check the release
        env:
          QUOTAPILOT_RELEASE_BUILD: "1"
        run: |
          VERSION="${TAG#v}"
          [ "$VERSION" = "$(cat VERSION)" ] || { echo "::error::tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
          ./scripts/check.sh
      - name: Source archive and notes
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          python3 scripts/source-archive.py "dist/QuotaPilot-$VERSION-source.zip"
          (cd dist && shasum -a 256 "QuotaPilot-$VERSION-source.zip" > SHA256SUMS.txt)
          # The CHANGELOG section for this version, up to the next "## " heading.
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > dist/notes.md
          printf '\n\nInstall or update:\n\n```sh\nbrew tap dwagwd/quotapilot https://github.com/dwagwd/quotapilot\nbrew install dwagwd/quotapilot/quotapilot   # or: brew upgrade quotapilot\n```\n\nApple Silicon Macs on macOS 15 or later get a prebuilt package; other Macs build from source (about 2 minutes, needs the Xcode Command Line Tools).\n' >> dist/notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          # A retry by workflow_dispatch finds the release already there: keep it and only add the missing files.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/QuotaPilot-$VERSION-source.zip" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "QuotaPilot $VERSION" \
            --notes-file dist/notes.md --verify-tag "dist/QuotaPilot-$VERSION-source.zip" dist/SHA256SUMS.txt
  bottle:
    needs: release
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build the bottle and install it
        run: ./scripts/build-bottle.sh "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" "$RUNNER_TEMP/bottle"
      - name: Upload to the release
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/bottle/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Bottle uploaded. Next: scripts/add-bottle.sh $TAG, then commit the formula." >> "$GITHUB_STEP_SUMMARY"
  cli:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, container: "swift:6.2", ext: tar.gz }
          - { name: linux-arm64, os: ubuntu-24.04-arm, container: "swift:6.2", ext: tar.gz }
          - { name: windows-x64, os: windows-latest, ext: zip }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    continue-on-error: ${{ matrix.optional == true }}
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: quotapilot-${{ matrix.name }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install Swift (Windows)
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@581df1ffa3f3e786ddc73ff37364ee231f9644c5 # v0.3.0
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update -qq && apt-get install -y -qq gh >/dev/null
          swift build -c release --product quotapilot --static-swift-stdlib -Xswiftc -gnone -Xlinker -s
          cp .build/release/quotapilot quotapilot
          tar -czf "$ASSET" quotapilot LICENSE
          sha256sum "$ASSET" > "$ASSET.sha256"
          ./quotapilot version
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $swiftExe = (Get-Command swift.exe -CommandType Application).Source
          $swiftBin = Split-Path $swiftExe
          # Swift installs Toolchains\<version>+<variant> beside Runtimes\<version>.
          # Keep this version check aligned with the installer and packaging/windows licenses.
          $toolchain = [regex]::Match($swiftBin, '^(?<root>.+)\\Toolchains\\(?<version>6\.2(?:\.0)?)(?:\+[^\\]+)?\\usr\\bin$', 'IgnoreCase')
          if (!$toolchain.Success) {
            throw "Expected the Swift 6.2 release toolchain, got $swiftExe"
          }
          $runtimeBin = Join-Path $toolchain.Groups['root'].Value "Runtimes\$($toolchain.Groups['version'].Value)\usr\bin"
          if (!(Test-Path -LiteralPath (Join-Path $runtimeBin 'swiftCore.dll') -PathType Leaf)) {
            throw "Could not find the matching Swift runtime in $runtimeBin"
          }
          $runtimeDirs = @($runtimeBin, $swiftBin)
          $env:PATH = "$runtimeBin;$swiftBin;$env:PATH"
          & $swiftExe build -c release --product quotapilot --static-swift-stdlib -Xswiftc -gnone
          if ($LASTEXITCODE -ne 0) { throw "Swift build failed ($LASTEXITCODE)" }

          $dumpbin = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $crtDirs = @()
          if (Test-Path -LiteralPath $vswhere -PathType Leaf) {
            $vsArgs = @('-latest', '-products', '*', '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64')
            $vsInstall = & $vswhere @vsArgs -property installationPath
            if ($LASTEXITCODE -ne 0) { throw "vswhere failed ($LASTEXITCODE)" }
            if ($vsInstall) {
              $crtDirs += @(Get-Item -Path "$vsInstall\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
                Where-Object { $_.PSIsContainer -and $_.Parent.Parent.Name -match '^\d+(?:\.\d+){1,3}$' } |
                Sort-Object -Property { [version]$_.Parent.Parent.Name } -Descending |
                Select-Object -ExpandProperty FullName)
            }
            if (!$dumpbin) {
              $dumpbin = & $vswhere @vsArgs -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
                Select-Object -First 1
            }
          }
          if ($dumpbin) {
            $reader = $dumpbin
            $readerOption = '/dependents'
            $dllPattern = '^\s+([^\s\\/]+\.dll)\s*$'
          } else {
            $reader = Join-Path $swiftBin 'llvm-readobj.exe'
            if (!(Test-Path -LiteralPath $reader)) { throw 'Could not find dumpbin or Swift llvm-readobj' }
            $readerOption = '--coff-imports'
            $dllPattern = '^\s*Name:\s+([^\s\\/]+\.dll)\s*$'
          }

          function Get-ImportedDlls($binary) {
            $imports = & $reader $readerOption $binary
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect $binary ($LASTEXITCODE)" }
            foreach ($line in $imports) {
              if ($line -match $dllPattern) { $Matches[1] }
            }
          }

          $vcRuntimePattern = '^(?:vcruntime|msvcp|concrt|vccorlib|vcomp|vcamp)140.*\.dll$'
          $redistributableCrtPattern = '^(?:(?:vcruntime|msvcp)140.*|concrt140)\.dll$'
          $systemDir = Join-Path $env:SystemRoot 'System32'
          function Test-SystemDll($dll) {
            if ($dll -match '^(api|ext)-ms-win-' -or $dll -eq 'ucrtbase.dll') { return $true }
            if ($dll -match $vcRuntimePattern) { return $false }
            $systemDll = Get-Item -LiteralPath (Join-Path $systemDir $dll) -ErrorAction SilentlyContinue
            # System32 on the runner also contains redistributable and third-party DLLs.
            return ($null -ne $systemDll -and $systemDll.VersionInfo.ProductName -match '^Microsoft.*Windows.*Operating System$')
          }

          $bundle = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item .build\release\quotapilot.exe, LICENSE -Destination $bundle
          Copy-Item packaging\windows\*.txt -Destination $bundle
          $pending = [System.Collections.Generic.Queue[string]]::new()
          $seen = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $exeImports = @(Get-ImportedDlls "$bundle\quotapilot.exe")
          if (!$exeImports.Count) { throw 'No DLL imports found in quotapilot.exe' }
          foreach ($dll in $exeImports) { $pending.Enqueue($dll) }
          # Include ICU data even when Foundation's ICU loads it outside the import table.
          Get-ChildItem -LiteralPath $runtimeDirs -Filter '*.dll' -File |
            Where-Object { $_.Name -match '^(?:_FoundationICU|icu(?:uc|in|dt)[\w-]*)\.dll$' } |
            ForEach-Object { $pending.Enqueue($_.Name) }

          while ($pending.Count -gt 0) {
            $dll = $pending.Dequeue()
            if (!$seen.Add($dll) -or (Test-SystemDll $dll)) { continue }

            $isVcRuntime = $dll -match $vcRuntimePattern
            if ($isVcRuntime -and $dll -notmatch $redistributableCrtPattern) {
              throw "Unsupported Visual C++ runtime dependency $dll"
            }
            $sourceDirs = if ($isVcRuntime) { $crtDirs } else { $runtimeDirs }
            $source = $sourceDirs | ForEach-Object { Join-Path $_ $dll } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (!$source -and $isVcRuntime) {
              throw "Could not find imported CRT DLL $dll in the Visual Studio x64 redistributable directories"
            }
            if (!$source) { throw "Could not resolve dependency $dll" }
            Copy-Item -LiteralPath $source -Destination $bundle
            foreach ($dependency in (Get-ImportedDlls (Join-Path $bundle $dll))) { $pending.Enqueue($dependency) }
          }

          $stagedFiles = Get-ChildItem -LiteralPath $bundle -File
          foreach ($binary in ($stagedFiles | Where-Object { $_.Extension -in '.exe', '.dll' })) {
            foreach ($dll in (Get-ImportedDlls $binary.FullName)) {
              if (!(Test-SystemDll $dll) -and !(Test-Path -LiteralPath (Join-Path $bundle $dll) -PathType Leaf)) {
                throw "$($binary.Name) imports $dll, which is missing from the staging folder"
              }
            }
          }

          # Archive individual files so Expand-Archive puts them directly in its destination.
          Compress-Archive -LiteralPath $stagedFiles.FullName -DestinationPath $env:ASSET
          $smokeRoot = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          $originalPath = $env:PATH
          Push-Location
          try {
            Expand-Archive -LiteralPath $env:ASSET -DestinationPath $smokeRoot
            $extracted = Get-ChildItem -LiteralPath $smokeRoot -Force
            if (($extracted | Where-Object PSIsContainer) -or
                (Compare-Object -ReferenceObject $stagedFiles.Name -DifferenceObject $extracted.Name)) {
              throw 'Windows ZIP must contain all staged files directly at its root'
            }
            Set-Location -LiteralPath $smokeRoot
            $env:PATH = 'C:\Windows\System32;C:\Windows'
            & "$PSHOME\pwsh.exe" -NoProfile -NonInteractive -Command {
              $ErrorActionPreference = 'Stop'
              foreach ($argument in @('version', '--help')) {
                $stdout = Join-Path $PWD 'smoke-stdout.log'
                $stderr = Join-Path $PWD 'smoke-stderr.log'
                $process = Start-Process -FilePath "$PWD\quotapilot.exe" -ArgumentList $argument `
                  -WorkingDirectory $PWD -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                try {
                  if (!$process.WaitForExit(60000)) {
                    $process.Kill($true)
                    throw "quotapilot.exe $argument timed out after 60 seconds"
                  }
                  $process.WaitForExit()
                  $code = $process.ExitCode
                } finally {
                  $process.Dispose()
                }
                $output = Get-Content -LiteralPath $stdout, $stderr -Raw
                $output | Write-Host
                $missingDll = '\.dll\b[^\r\n]*(?:not (?:be )?found|missing)|(?:missing|cannot find|could not find|unable to load|failed to load)[^\r\n]*\.dll\b'
                if ($code -ne 0 -or ($output -join [Environment]::NewLine) -match $missingDll) {
                  throw "quotapilot.exe $argument failed the isolated smoke test (exit $code)"
                }
              }
            }
            if ($LASTEXITCODE -ne 0) { throw "Windows smoke test failed ($LASTEXITCODE)" }
          } finally {
            $env:PATH = $originalPath
            Pop-Location
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force
          }

          $h = (Get-FileHash $env:ASSET -Algorithm SHA256).Hash.ToLower()
          "$h  $env:ASSET" | Out-File -Encoding ascii "$env:ASSET.sha256"
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber
