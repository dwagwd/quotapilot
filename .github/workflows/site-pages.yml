# Publishes site/ (AI Quota Watch) to GitHub Pages. Enable Pages with source "GitHub Actions" first.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "collector/**"]
  workflow_run:
    workflows: [Community data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # After a community-data run, deploy only when it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check data
        working-directory: site
        run: npm test
      - name: Build the search pages and sitemap
        working-directory: site
        # Canonical URLs point at the Cloudflare site; the GitHub Pages copy is a backup.
        run: node scripts/build-pages.mjs --base "https://aiquotawatch.pages.dev/"
      - name: Package the static files only
        run: |
          mkdir -p _site
          cp -R site/index.html site/404.html site/assets site/data site/plans site/effort site/resets site/zh site/sitemap.xml site/robots.txt site/_headers _site/
          rm -rf _site/data/submissions
      - name: Use the latest community stats
        run: |
          git fetch --depth 1 origin community-data 2>/dev/null && git show FETCH_HEAD:community.json > _site/data/community.json || echo "No community data yet"
      - name: Deploy to Cloudflare Pages (primary)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "No Cloudflare token yet; skipping"; exit 0; }
          rm -rf site/_site && cp -R _site site/_site
          cd site && npx -y wrangler@4.156.1 pages deploy _site --project-name aiquotawatch --branch main --commit-dirty=true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
