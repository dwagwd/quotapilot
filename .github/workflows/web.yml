# Checks the AI Quota Watch website and anonymous collector on every push and pull request that touches them.
# (The main CI workflow ignores site/ changes, and the site deploy workflow only runs on main.)
name: Website and collector
on:
  push:
    paths: ["site/**", "collector/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["site/**", "collector/**", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Website data, aggregation and translations
        working-directory: site
        run: npm test
      - name: Collector
        run: node --test collector/test/worker.test.mjs
      - name: Build static pages
        working-directory: site
        run: node scripts/build-pages.mjs
