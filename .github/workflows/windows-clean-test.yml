# Manual end-to-end check of a published Windows release on a clean Windows image
# (Windows Server Core container: no Swift toolchain, no Visual Studio, no Visual C++ redistributable).
# After the container run, the tray app is started on the host desktop and a screenshot is uploaded.
# It downloads the release zip exactly as a user would, extracts it, and runs the main commands inside the container.
name: Windows clean test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test, e.g. v0.9.7"
        required: true

permissions:
  contents: read

jobs:
  clean-windows:
    runs-on: windows-2022
    steps:
      - name: Download and extract the release zip
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'qp'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'qp.zip'
          Invoke-WebRequest -Uri "https://github.com/dwagwd/quotapilot/releases/download/$env:TAG/quotapilot-windows-x64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          Get-ChildItem $dir | Format-Table Name, Length -AutoSize | Out-String -Width 200
          $script = @'
          $ErrorActionPreference = 'Continue'
          Set-Location C:\qp
          foreach ($dll in 'swiftCore.dll','swiftWinSDK.dll','vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            "Image System32 has ${dll}: $(Test-Path (Join-Path $env:WINDIR "System32\$dll"))"
          }
          $failed = $false
          $commands = @(
            @('version'), @('--help'), @('status'), @('status', '--json'), @('stats', '--hours', '24'),
            @('route'), @('local', 'status'), @('local', 'hardware'), @('compare'), @('config')
          )
          foreach ($a in $commands) {
            $line = ".\quotapilot.exe $($a -join ' ')"
            "=== $line"
            $out = & .\quotapilot.exe @a 2>&1 | Out-String
            $code = $LASTEXITCODE
            $out.Trim()
            "--- exit code $code"
            # 0xC0000135 = DLL not found, 0xC0000139 = entry point not found, 0xC000007B = bad image.
            if ($code -in -1073741515, -1073741511, -1073741701 -or $out -match '\.dll') { "FAILED: missing or broken DLL"; $failed = $true }
            if (($a[0] -in 'version', '--help') -and $code -ne 0) { "FAILED: $line"; $failed = $true }
          }
          if ($failed) { exit 1 }
          '@
          Set-Content -Encoding utf8 -Path (Join-Path $dir 'clean-test.ps1') -Value $script
      - name: Run the main commands in a clean Windows Server Core container
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'qp'
          docker run --rm -v "${dir}:C:\qp" mcr.microsoft.com/windows/servercore:ltsc2022 powershell -NoProfile -ExecutionPolicy Bypass -File C:\qp\clean-test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Clean Windows test failed ($LASTEXITCODE)" }
      # The container has no desktop session; this host has one, so the tray app is started here (not in the container).
      - name: Start the tray app on the desktop and take a screenshot
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'qp'
          $tray = Join-Path $dir 'QuotaPilotTray.exe'
          $cli = Join-Path $dir 'quotapilot.exe'
          if (!(Test-Path -LiteralPath $tray)) { Write-Host "No QuotaPilotTray.exe in $env:TAG (older release): skipped"; exit 0 }
          if ((Get-FileHash $tray).Hash -eq (Get-FileHash $cli).Hash) { throw 'QuotaPilotTray.exe and quotapilot.exe are the same file' }
          $env:QUOTAPILOT_TRAY_CLI = $cli
          $process = Start-Process -FilePath $tray -ArgumentList '--show-card' -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 10
          $shot = Join-Path $env:RUNNER_TEMP 'tray-screenshot.png'
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
          } catch { Write-Host "::warning::Screenshot failed: $_" }
          $process.Refresh()
          if ($process.HasExited) { throw "QuotaPilotTray.exe exited after start (exit code $($process.ExitCode))" }
          Write-Host "QuotaPilotTray.exe is still running (PID $($process.Id))"
          Stop-Process -Id $process.Id -Force
          if (!(Test-Path -LiteralPath $shot)) { throw 'No screenshot was captured' }
          Copy-Item -LiteralPath $shot -Destination (Join-Path $env:GITHUB_WORKSPACE 'tray-screenshot.png')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tray-screenshot-windows
          path: tray-screenshot.png
          if-no-files-found: warn
